name: CMake source list repair

on:
  push:
    branches: [ddnet-ios]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ddnet-ios
          fetch-depth: 0
      - name: Repair CMake source list
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CMakeLists.txt')
          s = p.read_text()
          marker = '    components/kinetix/clickgui.h\n'
          entries = (
              '    components/kinetix/code_exec/code_exec.cpp\n'
              '    components/kinetix/code_exec/code_exec.h\n'
              '    components/kinetix/code_exec/code_exec_bindings.cpp\n'
          )
          if 'components/kinetix/code_exec/code_exec.cpp' not in s:
              if marker not in s:
                  raise SystemExit('GAME_CLIENT insertion marker not found')
              s = s.replace(marker, marker + entries, 1)
              p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt
          git rm .github/workflows/cmake-repair.yml
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'build: add missing kinetix code_exec sources'
          git push origin HEAD:ddnet-ios
